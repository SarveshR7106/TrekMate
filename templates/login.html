{% extends "base.html" %}
{% block title %}Login Page{% endblock %}
{% block content %}
    <div class="row justify-content-center mt-4">
        <div class="col-md-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h3 class="fw-bold mb-4 text-center" style="color:#1a3c2e;">Login</h3>
                    <form action="#" method="POST" autocomplete="off">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" minlength="5" required>
                        </div>
                        <div class="mb-3">
                            <select class="form-select" aria-label="Default select example" name="role" required>
                                <option selected>Choose your role</option>
                                <option value="admin">Admin</option>
                                <option value="staff">Staff</option>
                                <option value="user">User</option>
                            </select>
                        </div>
                        <div class="d-grid mt-3">
                            <button type="submit" class="btn btn-lg" style="background-color:#1a3c2e; color:white;">Login</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
{% endblock %}
