{% extends "base.html" %}
{% block title %}Admin Page{% endblock %}
{% block content %}
    <p>Hello admin!!</p>
    {% for p in pending_req %}
        <table class="table">
            <tbody>
                <tr>
                    <td>{{ p.name }}</td>
                    <td>{{ p.email }}</td>
                    <td>
                        <form method="POST" action="{{ url_for('staff_approval', staff_id = p._id) }}">
                            <button type="submit" class="btn btn-success" name="action" value="accept">Accept</button>
                            <button type="submit" class="btn btn-danger" name="action" value="reject">Reject</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    {% endfor %}

    {% for a in active_staff %}
        <table class="table" title="Active Staff">
            <tr>
                <td><p>Name: {{ a.name }}</p></td>
                <td><p>Username: {{ a.username }}</p></td>
                <td><p>Email: {{ a.email }}</p></td>
                <button type="submit">Blacklist</button>
            </tr>
        </table>
    {% endfor %}
{% endblock %}
